spring:
  application:
    name: monitor-backend

server:
  port: 8080
  shutdown: graceful

  spring:
    lifecycle:
      timeout-per-shutdown-phase: 30s

logging:
  level:
    divera.response: INFO

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: monitor-backend
    distribution:
      percentiles-histogram:
        monitor.divera.api.latency: true
        monitor.poll.duration: true
  prometheus:
    metrics:
      export:
        enabled: true

geocoding:
  base-url: https://nominatim.openstreetmap.org
  user-agent: "monitor-backend/1.0 (kontakt@einsatzlog112.de)"
  connect-timeout: 5s
  read-timeout: 5s