name: Security Scan

on:
  schedule:
    - cron: '0 6 * * 1'
  push:
    branches: [develop, main]

permissions:
  security-events: write

jobs:
  security:
    name: 🔒 Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: OSV Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.5.1
        with:
          scan-args: |-
            --lockfile=pom.xml
            --format=table

      - name: OSV SARIF Report
        if: always()
        uses: google/osv-scanner-action/osv-scanner-action@v2.5.1
        with:
          scan-args: |-
            --lockfile=pom.xml
            --format=sarif
            --output=osv-report.sarif

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: osv-report.sarif